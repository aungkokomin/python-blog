<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'blog/css/formstyle.css' %}">
</head>
<body>
    <!-- Error Message pop-up -->
    {% if error_message %}
    <div id="errorAlert" class="alert-popup" role="alert" aria-live="assertive">
        <div class="alert-icon" aria-hidden="true">!</div>
        <div class="message">
            <span class="title">Error</span>
            <span class="detail">{{ error_message }}</span>
        </div>
        <button id="errorAlertClose" class="alert-close" type="button" aria-label="Close">&times;</button>
    </div>
    {% endif %}
    <div class="login-container">
        <h1>Login</h1>
        <form method="post">
            <!-- Django CSRF token would go here -->
            <!-- {% csrf_token %} -->

            <!-- Demo form fields - replace with {{ form.as_p }} in Django -->
            {% csrf_token %}
            <div class="form-fields">
            {{ form.as_p }}
            </div>

            <div class="remember-me-container">
                <input type="checkbox" name="remember_me" id="id_remember_me" class="form-check-input">
                <label for="id_remember_me">Remember Me</label>
            </div>
            <div>
                <button id="form-submit" type="submit">Login</button>
            </div>
        </form>

        <div class="additional-links">
            <a href="/password-reset">Forgot password?</a> | <a href="/register">Create an account</a>
        </div>
    </div>
</body>
<script>
document.addEventListener('DOMContentLoaded', function(){
    var alertEl = document.getElementById('errorAlert');
    var closeBtn = document.getElementById('errorAlertClose');
    if (!alertEl || !closeBtn) return;
    closeBtn.addEventListener('click', function(){
        alertEl.classList.add('hide');
        setTimeout(function(){ if (alertEl && alertEl.parentNode) alertEl.parentNode.removeChild(alertEl); }, 260);
    });
});
</script>
</html>
