<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title|default:"My Blog" }}</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --accent:#2b6cb0;
      --muted:#6b7280;
      --radius:10px;
      --glass: rgba(255,255,255,0.6);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial;
      background:linear-gradient(180deg,#eef3fb 0%,var(--bg) 100%);
      color:#111827;
      -webkit-font-smoothing:antialiased;
    }
    header{
      padding:32px 20px;
      text-align:center;
    }
    .site-title{
      margin:0;
      font-size:1.75rem;
      letter-spacing:-0.02em;
      color:var(--accent);
    }
    .lead{
      margin-top:6px;
      color:var(--muted);
      font-size:0.95rem;
    }
    main{
      max-width:960px;
      margin:20px auto;
      padding:0 16px 48px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:18px;
    }
    .post-card{
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:0 6px 18px rgba(17,24,39,0.06);
      display:flex;
      flex-direction:column;
      min-height:180px;
      transition:transform .18s ease,box-shadow .18s ease;
    }
    .post-card:hover{
      transform:translateY(-6px);
      box-shadow:0 18px 40px rgba(17,24,39,0.08);
    }
    .post-title{
      margin:0 0 8px 0;
      font-size:1.15rem;
      color:#0f172a;
    }
    .meta{
      font-size:0.86rem;
      color:var(--muted);
      margin-bottom:12px;
    }
    .excerpt{
      color:#374151;
      line-height:1.5;
      flex:1;
      margin-bottom:14px;
      white-space:pre-wrap;
      overflow:hidden;
    }
    .actions{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:8px;
      text-decoration:none;
      font-weight:600;
      font-size:0.92rem;
      border:1px solid transparent;
      transition:background .15s ease,transform .12s ease;
    }
    .btn-show{
      background:linear-gradient(90deg,#ffffff,var(--glass));
      color:var(--accent);
      border-color:rgba(43,108,176,0.12);
    }
    .btn-edit{
      background:var(--accent);
      color:white;
    }
    .btn:hover{ transform:translateY(-2px) }
    @media (max-width:520px){
      .site-title{ font-size:1.4rem }
      header{ padding:20px 12px }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="site-title">{{ title|default:"My Blog" }}</h1>
    <div class="lead">Latest posts from the community</div>
  </header>

  <main>
    <div class="grid">
      {% for post in posts %}
      <article class="post-card">
        <h2 class="post-title">{{ post.title }}</h2>
        <div class="meta">By <em>{{ post.author }}</em> • <time>{{ post.date_posted|date:"F j, Y" }}</time></div>
        <div class="excerpt">{{ post.content|truncatewords:30 }}</div>
        <div class="actions">
          <a class="btn btn-show" href="/blog/{{ post.id }}/show">Show</a>
          <a class="btn btn-edit" href="/blog/{{ post.id }}/edit">Edit</a>
        </div>
      </article>
      {% empty %}
      <div style="padding:24px;background:var(--card);border-radius:var(--radius);text-align:center;color:var(--muted)">
        No posts yet.
      </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
