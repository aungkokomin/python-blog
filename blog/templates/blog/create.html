{% extends "blog/base.html" %}
{% block content %}
    <main class="main">
        <div class="topbar" role="navigation" aria-label="Top navigation">
            <div class="topbar-left" style="display:flex;align-items:center;gap:12px">
                <a href="/blog" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit">
                    <div style="display:flex;flex-direction:column;line-height:1">
                        <nav aria-label="Breadcrumb">
                            <ol style="list-style:none;padding:0;margin:6px 0 0;display:flex;gap:8px;color:var(--muted);font-size:0.9rem">
                                <li><a href="/blog" style="color:var(--muted);text-decoration:none"><b>Dashboard</b></a></li>
                                {% if section %}<li aria-hidden="true">›</li><li style="color:var(--muted)">{{ section }}</li>{% endif %}
                                {% if title %}<li aria-hidden="true">›</li><li style="color:var(--muted)">{{ title }}</li>{% endif %}
                            </ol>
                        </nav>
                    </div>
                </a>
            </div>
            <div class="top-actions" style="display:flex;align-items:center;gap:12px">
                <form action="/blog/search/" method="get" style="display:flex;align-items:center;gap:8px">
                    <input name="q" placeholder="Search posts..." style="padding:8px;border-radius:8px;border:1px solid rgba(15,23,42,0.06)" />
                    <button class="btn btn-ghost" type="submit">Search</button>
                </form>
                <!--            <div style="display:flex;align-items:center;gap:8px">-->
                <!--              <div class="avatar" style="width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:rgba(15,23,42,0.06);font-weight:700">-->
                <!--                {{ user.username|first|upper }}-->
                <!--              </div>-->

                <!--              {% url 'logout' as logout_url %}-->
                <!--              {% if logout_url %}-->
                <!--              <a href="{{ logout_url }}" class="btn btn-ghost">Logout</a>-->
                <!--              {% else %}-->
                <!--              <a href="/logout/" class="btn btn-ghost">Logout</a>-->
                <!--              {% endif %}-->
                <!--            </div>-->
            </div>
        </div>

        <section class="form-card" aria-live="polite">
            <h3 class="form-title">Create New Post</h3>
            <form action="/blog/store/" method="POST" class="form-stack">
                <!-- Django CSRF token -->
                {% csrf_token %}

                <div class="form-row">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-row">
                    <label for="author">Author</label>
                    <select name="author_id" id="author" required>
                        <option value="" disabled selected>Select an author</option>
                        {% for author in authors %}
                            <option value="{{ author.id }}">{{ author.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-row">
                    <label for="content">Content</label>
                    <textarea id="content" name="content" rows="10" required></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Create Post</button>
                    <a class="btn btn-secondary" href="/blog/">Cancel</a>
                </div>
            </form>
        </section>
    </main>
{% endblock %}
